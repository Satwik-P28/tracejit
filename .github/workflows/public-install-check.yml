name: Public install check

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify (defaults to ./VERSION)
        required: false
        type: string

permissions:
  contents: read

jobs:
  published:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          set -eu
          version="${RELEASE_VERSION}"
          if [ -z "$version" ]; then version=$(cat VERSION); fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RESULT version $version"
      - name: Install the published archive with the repository installer
        run: |
          set -eu
          unset TRACEJIT_RELEASE_DIR || true
          prefix=$(mktemp -d)
          TRACEJIT_INSTALL_PREFIX="$prefix" ./scripts/install-release.sh
          "$prefix/tracejit" --version
          test "$("$prefix/tracejit" --version)" = "tracejit ${RELEASE_VERSION}"
          doctor=$("$prefix/tracejit" doctor)
          printf '%s\n' "$doctor"
          printf '%s\n' "$doctor" | grep -q 'supported      yes'
          printf '%s\n' "$doctor" | grep -q 'ptrace         yes'
          TRACEJIT="$prefix/tracejit" ./scripts/demo.sh
          echo "RESULT published-binary demo PASS"

  manual:
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Follow the documented install instructions verbatim
        run: |
          set -eu
          version="${RELEASE_VERSION}"
          if [ -z "$version" ]; then version=$(cat VERSION); fi
          base="https://github.com/Satwik-P28/tracejit/releases/download/v${version}"
          name="tracejit-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          work=$(mktemp -d)
          cd "$work"
          curl -fsSLO "${base}/${name}"
          curl -fsSLO "${base}/SHA256SUMS"
          curl -fsSLO "${base}/RELEASE_MANIFEST.json"
          curl -fsSLO "${base}/sbom.cdx.json"
          sha256sum -c SHA256SUMS
          tar -xzf "$name"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "tracejit-v${version}-x86_64-unknown-linux-gnu/tracejit" "$HOME/.local/bin/tracejit"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(tracejit --version)" = "tracejit ${version}"
          tracejit doctor
          python3 -c 'import json; m=json.load(open("RELEASE_MANIFEST.json")); assert m["release"]["version"] == "'"$version"'"; print("manifest commit", m["release"]["commit"])'
          echo "RESULT manual-install PASS"
