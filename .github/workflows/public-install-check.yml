name: Public install check

on:
  workflow_dispatch:

jobs:
  published-v0-1-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the published v0.1.1 archive and run it
        run: |
          set -eu
          unset TRACEJIT_RELEASE_DIR || true
          prefix=$(mktemp -d)
          TRACEJIT_INSTALL_PREFIX="$prefix" ./scripts/install-release.sh
          "$prefix/tracejit" --version
          test "$("$prefix/tracejit" --version)" = "tracejit 0.1.1"
          doctor=$("$prefix/tracejit" doctor)
          printf '%s\n' "$doctor"
          printf '%s\n' "$doctor" | grep -q 'supported      yes'
          printf '%s\n' "$doctor" | grep -q 'ptrace         yes'
          TRACEJIT="$prefix/tracejit" ./scripts/demo.sh
          echo "RESULT published-binary demo PASS"
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Public release install and demo
        run: |
          set -eu
          unset TRACEJIT_RELEASE_DIR || true
          unset TRACEJIT_INSTALL_PREFIX || true
          work=$(mktemp -d)
          cd "$work"
          curl -fsSL -o tracejit-v0.1.0-x86_64-unknown-linux-gnu.tar.gz \
            https://github.com/Satwik-P28/tracejit/releases/download/v0.1.0/tracejit-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL -o SHA256SUMS \
            https://github.com/Satwik-P28/tracejit/releases/download/v0.1.0/SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -xzf tracejit-v0.1.0-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p ~/.local/bin
          install -m 755 tracejit-v0.1.0-x86_64-unknown-linux-gnu/tracejit ~/.local/bin/tracejit
          export PATH="$HOME/.local/bin:$PATH"
          tracejit --version
          tracejit doctor
          test "$(tracejit --version)" = "tracejit 0.1.0"
