name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      TRACEJIT_REQUIRE_PROVEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record the runner
        run: |
          set -eu
          echo "RESULT runner $(uname -s) $(uname -m)"
          uname -a
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/tracejit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          log = Path('/tmp/tracejit-tests.log').read_text(errors='replace')
          marker = log.rfind('\nfailures:')
          body = log[marker:] if marker != -1 else log
          body = body[-6000:]
          escaped = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=workspace test failure::' + escaped)
          PY
            exit "$status"
          fi
      - name: Release build
        run: cargo build --workspace --release
      - name: Doctor and kernel capabilities
        run: |
          set -eu
          doctor=$(./target/release/tracejit doctor)
          printf '%s\n' "$doctor"
          printf '%s\n' "$doctor" | grep -q 'supported      yes'
          printf '%s\n' "$doctor" | grep -q 'ptrace         yes'
          printf '%s\n' "$doctor" | grep -q 'seccomp        yes'
          printf '%s\n' "$doctor" | grep -q 'proven         yes'
          echo "RESULT doctor PASS"
          echo "RESULT ptrace PASS"
          echo "RESULT seccomp PASS"
          echo "RESULT proven PASS"
      - name: Linux integration
        run: |
          set -eu
          log=$(mktemp)
          set +e
          cargo test -p tracejit-cli --test linux_integration -- --nocapture --test-threads=1 >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "RESULT integration FAIL" >&2
            exit "$status"
          fi
          grep -E 'running [1-9][0-9]* tests' "$log"
          grep -q 'RESULT classification PASS' "$log"
          grep -q 'RESULT guarded_hit PASS' "$log"
          grep -q 'RESULT mutation DEOPT' "$log"
          grep -q 'RESULT sandbox PASS' "$log"
          grep -q 'RESULT proven-reuse PASS' "$log"
          grep -q 'vdso_clock' "$log"
          grep -q 'mmap_shared_write' "$log"
          grep -q 'mmap_shared_mprotect' "$log"
          echo "RESULT vdso_time PASS"
          echo "RESULT mmap_shared PASS"
          if grep -q 'RESULT sandbox SKIP' "$log"; then
            echo "RESULT integration FAIL: sandbox test skipped" >&2
            exit 1
          fi
          echo "RESULT integration PASS"
      - name: Real-world compatibility census
        run: |
          set -eu
          python3 -m pip install --quiet --disable-pip-version-check pillow ||
            echo "RESULT census: pillow unavailable; the image workload will be recorded as a missing tool"
          python3 benchmarks/realworld/census.py --runs 3 --warmups 1 \
            --output-dir "${RUNNER_TEMP}/census"
          echo "RESULT census PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracejit-census-${{ github.sha }}
          path: ${{ runner.temp }}/census
      - name: Demo
        run: |
          set -eu
          ./scripts/demo.sh
          git diff --exit-code -- benchmarks/workloads/c-transform/numbers.txt
          test -z "$(git status --porcelain)"
          echo "RESULT demo PASS"
