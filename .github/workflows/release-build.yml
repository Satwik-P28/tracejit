name: Release binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (defaults to ./VERSION)
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      TRACEJIT_REQUIRE_PROVEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        id: release
        run: |
          set -eu
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(cat VERSION); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RESULT version $version"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p tracejit-cli --test linux_integration -- --nocapture
      - run: cargo build --workspace --release
      - name: Version consistency
        env:
          TRACEJIT_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          test "$(./target/release/tracejit --version)" = "tracejit ${TRACEJIT_RELEASE_VERSION}"
          ./scripts/check-version-consistency.sh
      - name: Doctor reports a creatable cache instead of a false failure
        run: |
          set -eu
          doctor_out=$(./target/release/tracejit doctor)
          printf '%s\n' "$doctor_out"
          printf '%s\n' "$doctor_out" | grep -q 'supported      yes'
          if printf '%s\n' "$doctor_out" | grep -q 'not writable'; then
            echo "doctor treated a missing cache directory as unwritable" >&2
            exit 1
          fi
      - name: Canonical demo
        run: |
          set -eu
          ./scripts/demo.sh
          git diff --exit-code -- benchmarks/workloads/c-transform/numbers.txt
          test -z "$(git status --porcelain)"
      - name: Package Linux x86_64 archive
        env:
          TRACEJIT_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/package-release.sh dist
      - name: Test release install against the local archive
        env:
          TRACEJIT_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/test-install-release.sh dist
      - name: Verify the publicly documented install path
        env:
          TRACEJIT_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          prefix=$(mktemp -d)
          TRACEJIT_RELEASE_DIR=dist TRACEJIT_INSTALL_PREFIX="$prefix" ./scripts/install-release.sh
          test "$("$prefix/tracejit" --version)" = "tracejit ${TRACEJIT_RELEASE_VERSION}"
          TRACEJIT="$prefix/tracejit" ./scripts/demo.sh
          echo "RESULT packaged-binary demo PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: tracejit-v${{ steps.release.outputs.version }}-linux-x86_64
          path: dist/
          if-no-files-found: error
