name: Performance
description: A measured hot path, with before and after evidence when you have it.
title: "[performance] "
labels: ["performance"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Command, warmup count, and run count.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Medians from a real run. Do not estimate.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: TraceJIT commit
    validations:
      required: true
  - type: textarea
    id: testcase
    attributes:
      label: Minimal testcase
    validations:
      required: true
