name: Workload compatibility
description: A real command TraceJIT should accept or should keep refusing.
title: "[compatibility] "
labels: ["compatibility"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The exact command and how to run it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Classification, refusal text, or incorrect reuse.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel, architecture, filesystem, and relevant toolchain versions.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: TraceJIT commit
    validations:
      required: true
  - type: textarea
    id: testcase
    attributes:
      label: Minimal testcase
    validations:
      required: true
