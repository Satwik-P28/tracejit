name: Syscall coverage
description: One unmodeled or misclassified syscall, with a focused test.
title: "[syscall] "
labels: ["syscall-coverage", "safety"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected classification
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual classification
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: TraceJIT commit
    validations:
      required: true
  - type: textarea
    id: testcase
    attributes:
      label: Minimal testcase
      description: One syscall or one program, small enough to become a fixture.
    validations:
      required: true
